<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Дневничок</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="planner.css"> <!-- Иконки и ярлык для телефона -->
    <meta name="theme-color" content="#2a0a3d">
    <link rel="manifest" href="site.webmanifest">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
</head>
<body>
    <div class="bg-layer" id="bg-layer-planner"></div>
    <div class="particles" id="particles-planner"></div>

    <main class="planner-container">
        <header class="planner-header">
            <a href="index.html" class="back-btn" aria-label="Назад">← Назад</a>
            <h1 id="planner-title">Трекер 📊</h1>
            <div style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
                <span id="network-status-badge" class="network-status-badge" title="Статус подключения">🌐</span>
                <button id="profile-toggle-btn" class="profile-toggle-btn" title="Переключить профиль">👦</button>
            </div>
        </header>

        <section class="date-selector">
            <button id="prev-day" class="date-nav-btn">◀</button>
            <h2 id="current-date-display">Сегодня</h2>
            <button id="next-day" class="date-nav-btn">▶</button>
        </section>

        <!-- Контейнер для всех виджетов (рендер через JS) -->
        <section class="widgets-list" id="widgets-container">
            <div class="loader">Загрузка...</div>
        </section>

        <button class="btn btn-add-category" id="btn-add-category">+ Добавить свою категорию</button>
    </main>

    <!-- Модальное окно создания кастомной категории -->
    <div class="modal-overlay" id="create-category-modal" aria-hidden="true" role="dialog">
        <div class="modal">
            <div class="modal-icon">✨</div>
            <h2 class="modal-title">Новая категория</h2>
            <div class="form-group">
                <input type="text" id="category-name" class="modal-input" placeholder="Название (например: 💧 Вода)" maxlength="30">
            </div>
            
            <div class="form-group">
                <p class="modal-label">Тип трекера:</p>
                <div class="type-selector">
                    <button class="type-btn active" data-type="checkbox">✅ Чекбокс</button>
                    <button class="type-btn" data-type="text">✍️ Текст / Число</button>
                </div>
            </div>

            <div class="modal-btn-group">
                <button class="btn btn-confirm" id="btn-save-category">Создать</button>
                <button class="btn btn-modal-close" id="btn-cancel-category">Отмена</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="shared_audio.js"></script>
    <script src="planner.js"></script>
</body>
</html>
